<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5ef">
  <title>まいにち食費</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root{--ink:#20251f;--muted:#81877e;--line:#e9e8df;--paper:#fffefa;--bg:#f7f5ef;--green:#496a50;--green2:#e9f0e7;--orange:#d57a4a;--shadow:0 10px 35px #2732250c}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;font-size:15px}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1080px;margin:auto;padding:28px 26px 64px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:42px;height:42px;border-radius:15px;background:var(--green);display:grid;place-items:center;color:white;font-size:21px}.brand h1{font-size:19px;margin:0;letter-spacing:.02em}.brand p{font-size:12px;color:var(--muted);margin:3px 0 0}.month-nav{display:flex;align-items:center;gap:12px}.month-nav button{border:1px solid var(--line);background:var(--paper);border-radius:11px;width:36px;height:36px;color:var(--green);font-size:19px}.month-label{font-weight:650;min-width:112px;text-align:center;font-size:14px}.hero{background:var(--green);color:white;border-radius:24px;padding:28px 30px;position:relative;overflow:hidden;box-shadow:var(--shadow);margin-bottom:18px}.hero:after{content:"";position:absolute;width:250px;height:250px;right:-76px;top:-120px;border-radius:50%;border:1px solid #ffffff20;box-shadow:0 0 0 28px #ffffff0a,0 0 0 62px #ffffff08}.hero-top{font-size:13px;color:#d7e1d5;display:flex;align-items:center;gap:8px}.hero-amount{font-size:clamp(36px,7vw,54px);font-weight:650;letter-spacing:-.045em;margin:12px 0 7px}.hero-bottom{font-size:13px;color:#e2e9df}.delta{font-weight:650;color:white}.hero-bottom .up{color:#ffd0b5}.hero-bottom .down{color:#d7f0d6}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}.stat{background:var(--paper);border:1px solid var(--line);border-radius:19px;padding:17px 19px;box-shadow:var(--shadow)}.stat .label{color:var(--muted);font-size:12px}.stat .value{font-size:21px;font-weight:650;margin-top:7px;letter-spacing:-.025em}.stat .hint{font-size:11px;color:var(--muted);margin-top:4px}.layout{display:grid;grid-template-columns:1.55fr .9fr;gap:18px;align-items:start}.panel{background:var(--paper);border:1px solid var(--line);border-radius:21px;padding:21px;box-shadow:var(--shadow)}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.panel-head h2{font-size:16px;margin:0}.count{font-size:12px;color:var(--muted)}.entries{display:flex;flex-direction:column}.entry{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line)}.entry:first-child{border-top:0}.entry-icon{width:42px;height:42px;flex:none;border-radius:14px;background:#f2f0e8;display:grid;place-items:center;font-size:19px}.entry-main{min-width:0;flex:1}.entry-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.entry-sub{font-size:11px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.entry-price{font-size:14px;font-weight:650;white-space:nowrap}.entry-tools{display:flex;gap:5px;margin-left:3px}.icon-btn{border:0;background:transparent;color:#9a9c93;padding:6px;font-size:14px;border-radius:8px}.icon-btn:hover{background:#f0efe8;color:var(--ink)}.empty{text-align:center;padding:35px 14px;color:var(--muted);font-size:13px}.empty .emoji{font-size:28px;margin-bottom:10px}.side{display:flex;flex-direction:column;gap:16px}.form-title{font-size:16px;margin:0}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#f1f0e9;padding:4px;border-radius:12px;margin:16px 0}.tab{border:0;background:transparent;padding:9px;border-radius:9px;font-size:12px;color:var(--muted)}.tab.active{background:white;color:var(--green);font-weight:650;box-shadow:0 2px 6px #2221}.field{margin:12px 0}.field label{font-size:11px;color:#676d63;display:block;margin:0 0 6px 2px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:white;border-radius:11px;padding:11px 12px;color:var(--ink);outline:0}.field input:focus,.field select:focus,.field textarea:focus{border-color:#90a88f;box-shadow:0 0 0 3px #496a5012}.field textarea{resize:vertical;min-height:66px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.primary{width:100%;border:0;background:var(--green);color:white;border-radius:12px;padding:12px;font-weight:650;margin-top:4px}.primary:hover{background:#3e5b44}.scan-zone{border:1px dashed #c9d1c6;border-radius:15px;background:#fbfcf8;padding:20px 12px;text-align:center}.scan-zone .camera{font-size:26px}.scan-zone strong{display:block;font-size:13px;margin:7px 0 4px}.scan-zone p{margin:0;color:var(--muted);font-size:11px;line-height:1.6}.scan-zone label{display:inline-block;margin-top:13px;background:var(--green2);color:var(--green);padding:9px 14px;border-radius:10px;font-size:12px;font-weight:650;cursor:pointer}.scan-zone input{display:none}.progress{display:none;color:var(--green);font-size:12px;margin-top:10px}.progress.show{display:block}.scan-note{font-size:10px;color:var(--muted);line-height:1.6;margin:10px 2px 0}.preview{max-width:100%;max-height:135px;object-fit:contain;border-radius:9px;display:none;margin:0 auto 10px}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;background:#263329;color:white;padding:12px 18px;border-radius:13px;font-size:13px;transition:.25s;pointer-events:none;z-index:5}.toast.show{opacity:1;transform:translate(-50%,0)}.footer{text-align:center;color:#999c93;font-size:10px;margin:22px 0 0}.delete{color:#ba6951}.hidden{display:none!important}
    @media(max-width:720px){.app{padding:19px 15px 38px}.top{margin-bottom:20px}.layout{grid-template-columns:1fr}.cards{gap:9px}.stat{padding:14px 13px}.stat .value{font-size:17px}.stat .hint{font-size:10px}.hero{padding:23px;border-radius:20px}.panel{padding:18px}.month-label{min-width:98px}.brand h1{font-size:17px}}
    @media(max-width:380px){.cards{grid-template-columns:1fr 1fr}.cards .stat:last-child{grid-column:span 2}.entry-tools{gap:0}}
  </style>
</head>
<body>
<main class="app">
  <header class="top"><div class="brand"><div class="brand-mark">食</div><div><h1>まいにち食費</h1><p>食べた分だけ、気軽に記録。</p></div></div><div class="month-nav"><button id="prevMonth" aria-label="前の月">‹</button><div class="month-label" id="monthLabel"></div><button id="nextMonth" aria-label="次の月">›</button></div></header>
  <section class="hero"><div class="hero-top">今月の食費合計 <span>✳</span></div><div class="hero-amount" id="total">¥0</div><div class="hero-bottom" id="comparison">前月の記録と比べてみましょう</div></section>
  <section class="cards"><div class="stat"><div class="label">食料品</div><div class="value" id="groceryTotal">¥0</div><div class="hint">今月の合計</div></div><div class="stat"><div class="label">外食</div><div class="value" id="diningTotal">¥0</div><div class="hint">今月の合計</div></div><div class="stat"><div class="label">1日あたり</div><div class="value" id="dailyAverage">¥0</div><div class="hint">記録した日数で計算</div></div></section>
  <div class="layout"><section class="panel"><div class="panel-head"><h2>食費の記録</h2><span class="count" id="entryCount"></span></div><div class="entries" id="entries"></div></section><aside class="side"><section class="panel"><h2 class="form-title" id="formHeading">食費を記録</h2><div class="tabs"><button class="tab active" id="manualTab">手入力</button><button class="tab" id="receiptTab">レシート読取</button></div>
    <form id="entryForm"><div class="two"><div class="field"><label for="date">日付</label><input type="date" id="date" required></div><div class="field"><label for="amount">金額</label><input type="number" id="amount" min="1" step="1" placeholder="0" required></div></div><div class="field"><label for="store">店名</label><input id="store" placeholder="例：まるまるスーパー"></div><div class="field"><label for="category">分類</label><select id="category"><option value="grocery">食料品</option><option value="dining">外食</option></select></div><div class="field"><label for="memo">メモ</label><textarea id="memo" placeholder="買ったもの、気づいたことなど"></textarea></div><button class="primary" type="submit" id="saveBtn">記録する</button><button class="primary hidden" type="button" id="cancelEdit" style="background:#eaeae3;color:#52584e;margin-top:8px">編集をやめる</button></form>
    <div id="receiptPanel" class="hidden"><div class="scan-zone"><img id="preview" class="preview" alt="読み取るレシート"><div class="camera">📷</div><strong>レシートを撮影・選択</strong><p>日付・合計金額・店名を読み取ります</p><label for="receiptFile">カメラを起動する</label><input id="receiptFile" type="file" accept="image/*" capture="environment"></div><div class="progress" id="progress">レシートを読み取り中…</div><p class="scan-note">読み取り結果はフォームに入力されます。内容を確認・修正してから記録してください。画像はこの端末内で処理され、保存されません。</p></div>
    </section></aside></div>
  <p class="footer">記録はこの端末のブラウザに保存されます</p>
</main><div class="toast" id="toast"></div>
<script>
(()=>{
  const KEY='mainichi-shokuhi-v1';let records=load();let shown=new Date();shown.setDate(1);let editing=null;
  const $=id=>document.getElementById(id),fmt=n=>'¥'+Number(n||0).toLocaleString('ja-JP'),monthKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`,parseDate=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}function save(){localStorage.setItem(KEY,JSON.stringify(records))}function escapeHtml(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){const el=$('toast');el.textContent=s;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2300)}
  function render(){const key=monthKey(shown),curr=records.filter(x=>x.date.slice(0,7)===key),prevDate=new Date(shown.getFullYear(),shown.getMonth()-1,1),prev=records.filter(x=>x.date.slice(0,7)===monthKey(prevDate)),sum=a=>a.reduce((n,x)=>n+Number(x.amount),0),total=sum(curr),old=sum(prev),groceries=sum(curr.filter(x=>x.category==='grocery')),dining=sum(curr.filter(x=>x.category==='dining')),days=new Set(curr.map(x=>x.date)).size;
    $('monthLabel').textContent=`${shown.getFullYear()}年${shown.getMonth()+1}月`;$('total').textContent=fmt(total);$('groceryTotal').textContent=fmt(groceries);$('diningTotal').textContent=fmt(dining);$('dailyAverage').textContent=fmt(days?Math.round(total/days):0);$('entryCount').textContent=`${curr.length}件`;
    const diff=total-old,el=$('comparison');if(old===0){el.textContent=curr.length?'前月の記録がありません':'記録を追加すると前月比が表示されます'}else{const pct=Math.round(Math.abs(diff)/old*100),word=diff>0?'増':diff<0?'減':'変化なし',cls=diff>0?'up':'down';el.innerHTML=`前月 ${fmt(old)} より <span class="delta ${cls}">${word}${diff===0?'':` ${fmt(Math.abs(diff))}（${pct}%）`}</span>`}
    if(!curr.length){$('entries').innerHTML='<div class="empty"><div class="emoji">🥬</div>この月の記録はまだありません<br>右側から最初の食費を登録しましょう</div>';return}
    curr.sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt-a.createdAt);$('entries').innerHTML=curr.map(x=>`<article class="entry"><div class="entry-icon">${x.category==='dining'?'🍜':'🥬'}</div><div class="entry-main"><div class="entry-title">${escapeHtml(x.store|| (x.category==='dining'?'外食':'食料品'))}</div><div class="entry-sub">${parseDate(x.date).toLocaleDateString('ja-JP',{month:'numeric',day:'numeric',weekday:'short'})} · ${x.category==='dining'?'外食':'食料品'}${x.memo?' · '+escapeHtml(x.memo):''}</div></div><div class="entry-price">${fmt(x.amount)}</div><div class="entry-tools"><button class="icon-btn" data-edit="${x.id}" aria-label="編集">✎</button><button class="icon-btn delete" data-delete="${x.id}" aria-label="削除">×</button></div></article>`).join('');
  }
  function setTab(tab){const receipt=tab==='receipt';$('manualTab').classList.toggle('active',!receipt);$('receiptTab').classList.toggle('active',receipt);$('entryForm').classList.toggle('hidden',receipt);$('receiptPanel').classList.toggle('hidden',!receipt)}function resetForm(){editing=null;$('entryForm').reset();$('date').value=new Date().toISOString().slice(0,10);$('formHeading').textContent='食費を記録';$('saveBtn').textContent='記録する';$('cancelEdit').classList.add('hidden')}
  $('date').value=new Date().toISOString().slice(0,10);$('prevMonth').onclick=()=>{shown=new Date(shown.getFullYear(),shown.getMonth()-1,1);render()};$('nextMonth').onclick=()=>{shown=new Date(shown.getFullYear(),shown.getMonth()+1,1);render()};$('manualTab').onclick=()=>setTab('manual');$('receiptTab').onclick=()=>setTab('receipt');$('cancelEdit').onclick=resetForm;
  $('entryForm').addEventListener('submit',e=>{e.preventDefault();const id=editing||crypto.randomUUID();const record={id,date:$('date').value,amount:Number($('amount').value),store:$('store').value.trim(),category:$('category').value,memo:$('memo').value.trim(),createdAt:Date.now()};if(editing){const i=records.findIndex(x=>x.id===editing);if(i>=0)records[i]={...records[i],...record}}else records.push(record);save();shown=parseDate(record.date);resetForm();render();toast(editing?'記録を更新しました':'食費を記録しました')});
  $('entries').addEventListener('click',e=>{const eb=e.target.closest('[data-edit]'),db=e.target.closest('[data-delete]');if(eb){const x=records.find(r=>r.id===eb.dataset.edit);if(!x)return;editing=x.id;$('date').value=x.date;$('amount').value=x.amount;$('store').value=x.store;$('category').value=x.category;$('memo').value=x.memo;$('formHeading').textContent='記録を編集';$('saveBtn').textContent='変更を保存';$('cancelEdit').classList.remove('hidden');setTab('manual');window.scrollTo({top:document.querySelector('.side').offsetTop-15,behavior:'smooth'})}if(db){records=records.filter(x=>x.id!==db.dataset.delete);save();render();toast('記録を削除しました')}});
  function extractDate(text){const m=text.match(/(20\d{2})\s*[年/.-]\s*(\d{1,2})\s*[月/.-]\s*(\d{1,2})/);if(m)return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;const m2=text.match(/(\d{1,2})\s*月\s*(\d{1,2})\s*日/);if(m2)return `${new Date().getFullYear()}-${String(m2[1]).padStart(2,'0')}-${String(m2[2]).padStart(2,'0')}`;return ''}
  function extractAmount(text){const lines=text.split(/\n/).map(s=>s.trim()).filter(Boolean),hits=[];for(const line of lines){const cleaned=line.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));if(/(合計|総計|お買上|お支払|請求|total|amount)/i.test(cleaned)){const ms=[...cleaned.matchAll(/(?:¥|￥)?\s*(\d{1,3}(?:[,，]\d{3})+|\d{2,7})\s*円?/g)];for(const m of ms)hits.push(Number(m[1].replace(/[,，]/g,'')))}}if(hits.length)return Math.max(...hits);const nums=[...text.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).matchAll(/(?:¥|￥)\s*(\d{1,3}(?:[,，]\d{3})+|\d{3,7})/g)].map(m=>Number(m[1].replace(/[,，]/g,'')));return nums.length?Math.max(...nums):null}
  $('receiptFile').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;const img=$('preview');img.src=URL.createObjectURL(file);img.style.display='block';$('progress').classList.add('show');$('receiptFile').value='';if(!window.Tesseract){$('progress').textContent='読み取り機能の読み込みに失敗しました。手入力をご利用ください。';return}try{const result=await Tesseract.recognize(file,'jpn+eng',{logger:m=>{if(m.status==='recognizing text')$('progress').textContent=`読み取り中… ${Math.round(m.progress*100)}%`}});const text=result.data.text,date=extractDate(text),amount=extractAmount(text),lines=text.split(/\n/).map(s=>s.trim()).filter(s=>s.length>1);$('date').value=date||new Date().toISOString().slice(0,10);if(amount)$('amount').value=amount;$('store').value=lines.find(s=>!/(合計|総計|円|電話|TEL|レシート|領収|\d{2,})/i.test(s))||'';$('memo').value='';$('category').value='grocery';$('progress').textContent=amount?'読み取りました。内容を確認してください。':'文字を読み取りましたが金額を特定できませんでした。手入力で補ってください。';setTab('manual');toast(amount?'レシートを読み取りました':'金額を確認して入力してください')}catch(err){console.error(err);$('progress').textContent='読み取れませんでした。写真を撮り直すか手入力してください。'} });
  render();
})();
</script>
</body>
</html>
